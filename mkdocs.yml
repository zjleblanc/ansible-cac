site_name: AAP CaC - Autodotes
site_description: Configuration as Code for Ansible Automation Platform in the Autodotes Lab
docs_dir: .
site_dir: site

theme:
  name: material
  custom_dir: docs/mkdocs/overrides
  logo: docs/mkdocs/assets/logo.png
  favicon: docs/mkdocs/assets/logo.png
  font:
    text: Dosis
    code: Roboto Mono
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

extra_css:
  - docs/mkdocs/assets/extra.css

extra_javascript:
  - docs/mkdocs/assets/extra.js

hooks:
  - docs/mkdocs/hooks.py

# MkDocs excludes dot-directories by default (`.*` in exclude_docs); un-exclude
# only the agent skill/rule docs we intentionally publish, keeping everything
# else under .cursor/ (plans, cache, other rules) hidden from the site.
exclude_docs: |
  !.cursor/skills/
  !.cursor/skills/**
  !.cursor/rules/
  !.cursor/rules/agent/
  !.cursor/rules/agent/**

plugins:
  - same-dir
  - search
  - gen-files:
      scripts:
        - docs/mkdocs/gen_var_pages.py
        - docs/mkdocs/gen_agent_pages.py

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - admonition
  - pymdownx.details

nav:
  - Configuration:
      - Overview: config/README.md
      - Common: config/common/README.md
      - Cloud: config/cloud/README.md
      - Networking: config/networking/README.md
      - Linux: config/linux/README.md
      - Windows: config/windows/README.md
      - HashiCorp: config/hashi/README.md
      - AIOps: config/aiops/README.md
      - ServiceNow: config/servicenow/README.md
      - Apps: config/apps/README.md
      - AAP: config/aap/README.md
      - Hub: config/hub/README.md
  - Reference:
      - LDAP: config/common/LDAP.md
  - AI:
      - Skills:
          - CaC Parser:
              - Overview: .cursor/skills/cac-parser/SKILL.md
              - Key Ordering: .cursor/skills/cac-parser/key_ordering.md
              - Resource Map: .cursor/skills/cac-parser/resource-map.md
          - CaC Schedules: .cursor/skills/cac-schedules/SKILL.md
          - Changelog: .cursor/skills/changelog/SKILL.md
      - Rules: []
  - Contributing:
      - Changelog: CHANGELOG.md

validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: info
