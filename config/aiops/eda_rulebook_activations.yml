# ansible-playbook pb_aap_config.yml -e "domains=aiops" -e "skip_common=true" --tags rulebook_activation
---
eda_rulebook_activations_aiops:
  - name: DataDog Events
    description: Rulebook that processes various events sourced from DataDog problems
    organization: Autodotes
    project: EDA Demos
    rulebook: datadog_event_stream.yml
    decision_environment: Default Decision Environment
    event_streams:
      - event_stream: DataDog OAuth Event Stream
        source_name: DataDog Event Source
    eda_credentials:
      - Autodotes Controller
    enabled: false
    log_level: debug
    restart_policy: never
  - name: Dynatrace Events
    description: Rulebook that processes various events sourced from Dynatrace problems
    organization: Autodotes
    project: EDA Demos
    rulebook: dynatrace_event_stream.yml
    decision_environment: Default Decision Environment
    event_streams:
      - event_stream: Dynatrace Event Stream
        source_name: Dynatrace Event Source
    eda_credentials:
      - Autodotes Controller
    extra_vars:
      DT_PROBLEM_VIEW: "{{ eda_dt_problem_view }}"
    enabled: false
    log_level: error
    restart_policy: never
  - name: Service Now Requested Items
    description: Rulebook that ingests Service Now Requested Items based on Business Rules
    organization: Autodotes
    project: EDA Demos
    rulebook: sc_req_items.yml
    decision_environment: Default Decision Environment
    event_streams:
      - event_stream: ServiceNow Event Stream
        source_name: Service Now (Standard and OpenFlake) Event Source
    eda_credentials:
      - Autodotes Controller
    extra_vars:
      of_vm_decommission_cat_item: 27cb228749e34e069e2140f2901c6cb3
      of_vm_provision_cat_item: 9c5ccd545ad245789e3968e9f0f6e154
    enabled: false
    log_level: debug
    restart_policy: never
