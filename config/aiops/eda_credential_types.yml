# ansible-playbook pb_aap_config.yml -e "domains=aiops" -e "skip_common=true" --tags credential_type
---
eda_credential_types_aiops:
  - name: DataDog Service Access Token
    inputs:
      fields:
        - id: dd_bearer_token
          type: string
          label: Datadog Service Access Token
          secret: true
      required:
        - dd_bearer_token
    injectors:
      env:
        DD_BEARER_TOKEN: "{{ dd_bearer_token }}"
