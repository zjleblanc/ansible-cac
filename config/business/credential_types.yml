# ansible-playbook pb_aap_config.yml --tags business,credential_types --skip-tags common
---
controller_credential_types_business:
  - name: Google OAuth Client
    description: OAuth2 installed-app client credentials for the GCP
    kind: cloud
    inputs:
      fields:
        - id: google_client_id
          label: Google OAuth Client ID
          type: string
        - id: google_client_secret
          label: Google OAuth Client Secret
          secret: true
          type: string
        - id: google_refresh_token
          label: Google OAuth Refresh Token
          secret: true
          type: string
      required:
        - google_client_id
        - google_client_secret
        - google_refresh_token
    injectors:
      env:
        GOOGLE_CLIENT_ID: !unsafe "{{ google_client_id }}"
        GOOGLE_CLIENT_SECRET: !unsafe "{{ google_client_secret }}"
        GOOGLE_REFRESH_TOKEN: !unsafe "{{ google_refresh_token }}"
      extra_vars:
        google_client_id: !unsafe "{{ google_client_id }}"
        google_client_secret: !unsafe "{{ google_client_secret }}"
        google_refresh_token: !unsafe "{{ google_refresh_token }}"
