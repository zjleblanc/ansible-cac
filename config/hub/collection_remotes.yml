# ansible-playbook pb_aap_config.yml -e "domains=hub" -e "skip_common=true" --tags collectionremote
---
hub_collection_remotes_hub:
  - name: community
    url: https://galaxy.ansible.com/api/
    requirements:
      - name: awx.awx
        version: ">=22.7.0"
      - name: chocolatey.chocolatey
        version: ">=1.4.0"
      - name: community.aws
        version: ">=8.0.0"
      - name: community.crypto
        version: ">=2.21.1"
      - name: community.general
        version: ">=6.5.0"
      - name: community.hashi_vault
        version: ">=6.2.0"
      - name: community.windows
        version: ">=1.9.0"
      - name: community.network
        version: ">=5.0.0"
      - name: containers.podman
        version: ">=1.11.0"
      - name: theforeman.foreman
        version: ">=3.14.0"
      - name: fedora.linux_system_roles
        version: ">=1.0.0"
      - name: community.windows
        version: ">=1.9.0"
      - name: community.vmware
        version: ">=4.2.0"
      - name: cloin.eda
        version: ">=2.1.16"
      - name: cloin.datadog
        version: ">=1.0.5"
      - name: cloin.prometheus
        version: ">=0.1.0"
      - name: zjleblanc.eda
        version: ">=1.0.2"
      - name: zjleblanc.gsuite
        version: ">=1.0.1"
      - name: zjleblanc.kasa
        version: ">=1.1.0"
      - name: zjleblanc.reporting
        version: ">=1.0.0"
      - name: zjleblanc.rh_case_mgmt
        version: ">=1.0.1"
      - name: zjleblanc.tmdb
        version: ">=1.1.0"
      - name: zjleblanc.utils
        version: ">=1.0.0"
  - name: rh-certified
    url: https://console.redhat.com/api/automation-hub/content/published/
    auth_url: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
    token: "{{ hub_var_redhat_automation_hub_token }}"
    requirements:
      - name: amazon.aws
        version: ">=9.0.0"
      - name: ansible.controller
        version: ">=4.6.2"
      - name: ansible.eda
        version: ">=2.2.0"
      - name: ansible.hub
        version: ">=1.0.0"
      - name: ansible.netcommon
        version: ">=7.1.0"
      - name: ansible.network
        version: ">=5.0.0"
      - name: ansible.platform
        version: ">=2.5.3"
      - name: ansible.posix
        version: ">=1.6.2"
      - name: ansible.receptor
        version: ">=2.0.3"
      - name: ansible.scm
        version: ">=3.0.0"
      - name: ansible.utils
        version: ">=5.1.2"
      - name: ansible.windows
        version: ">=2.5.0"
      - name: azure.azcollection
        version: ">=1.15.0"
      - name: cisco.aci
        version: ">=2.12.0"
      - name: cisco.ios
        version: ">=11.0.0"
      - name: cisco.iosxr
        version: ">=11.0.0"
      - name: cisco.nxos
        version: ">=11.0.0"
      - name: cyberark.conjur
        version: ">=1.2.2"
      - name: cyberark.pas
        version: ">=1.0.27"
      - name: datadog.dd
        version: ">=6.2.0"
      - name: dynatrace.event_driven_ansible
        version: ">=1.2.3"
      - name: hashicorp.terraform
        version: ">=1.2.0"
      - name: microsoft.ad
        version: ">=1.5.0"
      - name: paloaltonetworks.panos
        version: ">=2.21.3"
      - name: redhat.insights
        version: ">=1.2.2"
      - name: redhat.rhel_system_roles
        version: ">=1.88.9"
      - name: servicenow.itsm
        version: ">=2.7.0"
      - name: vmware.vmware
        version: ">=1.6.0"
      - name: vmware.vmware_rest
        version: ">=4.2.0"
  - name: validated
    url: https://console.redhat.com/api/automation-hub/content/validated/
    auth_url: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
    token: "{{ hub_var_redhat_automation_hub_token }}"
    sync_dependencies: false
    requirements:
      - name: infra.ah_configuration
        version: ">=2.0.6"
      - name: infra.controller_configuration
        version: ">=2.6.0"
      - name: infra.ee_utilities
        version: ">=3.1.3"
      - name: infra.osbuild
        version: ">=2.3.0"
