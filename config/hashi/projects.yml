# ansible-playbook pb_aap_config.yml -e "domains=hashi" -e "skip_common=true" --tags projects
---
controller_projects_hashi:
  - name: Terraform Mgmt
    organization: Autodotes
    scm_type: git
    scm_url: https://github.com/zjleblanc/ansible-terraform.git
    scm_branch: master
    scm_clean: "no"
    scm_delete_on_update: "no"
    scm_update_on_launch: "no"
  - name: Zero Trust
    organization: Autodotes
    scm_type: git
    scm_url: https://github.com/zjleblanc/ansible-zero-trust.git
    scm_branch: main
    scm_clean: "no"
    scm_delete_on_update: "no"
    scm_update_on_launch: "no"
